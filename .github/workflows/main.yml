name: Build APK - Masjid Nurul Amal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/Masjid_Nurul_Amal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masjid-Nurul-Amal-APK
          path: release/Masjid_Nurul_Amal.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Masjid Nurul Amal v1.0.${{ github.run_number }}"
          files: release/Masjid_Nurul_Amal.apk
          generate_release_notes: true
